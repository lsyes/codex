[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "target-feature=+crt-static"]

# MSVC emits a warning about code that may trip "Cortex-A53 MPCore processor bug #843419" (see
# https://developer.arm.com/documentation/epm048406/latest) which is sometimes emitted by LLVM.
# Since Arm64 Windows 10+ isn't supported on that processor, it's safe to disable the warning.
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608", "-C", "link-arg=/arm64hazardfree"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]

# LoongArch64 release artifacts are cross-compiled with the loong64/cross-tools
# GNU toolchain (see .github/scripts/install-loongarch64-build-tools.sh), which
# exports CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER for cross builds so
# native loong64 builds keep using the host linker. The medium code model keeps
# the prebuilt rusty_v8 static library within the +/-2GiB PC-relative branch
# range, and --relax lets the bfd linker shrink calls where it can.
[target.loongarch64-unknown-linux-gnu]
rustflags = [
    "-C", "code-model=medium",
    "-C", "link-arg=-Wl,--relax",
]
